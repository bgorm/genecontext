name: Build and test plugin

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            sudo apt-get update
            sudo apt-get install -y g++ make pkg-config zlib1g-dev libzstd-dev python3
          else
            brew install pkgconf zlib zstd
            echo "PKG_CONFIG_PATH=$(brew --prefix zlib)/lib/pkgconfig:$(brew --prefix zstd)/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"
          fi

      - name: Build matching bcftools and HTSlib
        shell: bash
        run: |
          deps="$RUNNER_TEMP/genecontext-deps"
          mkdir -p "$deps"
          cd "$deps"
          curl -fL --retry 2 https://github.com/samtools/htslib/releases/download/1.25/htslib-1.25.tar.bz2 -o htslib.tar.bz2
          curl -fL --retry 2 https://github.com/samtools/bcftools/releases/download/1.25/bcftools-1.25.tar.bz2 -o bcftools.tar.bz2
          tar -xjf htslib.tar.bz2
          tar -xjf bcftools.tar.bz2
          export CPPFLAGS="$(pkg-config --cflags zlib libzstd)"
          export LDFLAGS="$(pkg-config --libs-only-L zlib libzstd)"
          cd "$deps/htslib-1.25"
          ./configure --prefix="$deps/install" --disable-libcurl --disable-s3 --disable-gcs --disable-bz2 --disable-lzma --without-libdeflate
          make -j2
          make install
          cd "$deps/bcftools-1.25"
          ./configure --with-htslib="$deps/htslib-1.25" --prefix="$deps/install"
          make -j2
          make install
          echo "$deps/install/bin" >> "$GITHUB_PATH"
          echo "PLUGIN_HTSLIB=$deps/htslib-1.25" >> "$GITHUB_ENV"

      - name: Build plugin and run integration tests
        shell: bash
        env:
          JOBS: 2
        run: |
          bash scripts/bootstrap.sh
          make test

      - name: Check installed plugin
        shell: bash
        run: |
          make install plugindir="$RUNNER_TEMP/genecontext-plugins"
          BCFTOOLS_PLUGINS="$RUNNER_TEMP/genecontext-plugins" bcftools +genecontext --help

      - name: Export and test public source tree
        shell: bash
        run: |
          make export EXPORT_DIR="$RUNNER_TEMP/genecontext-source"
          cd "$RUNNER_TEMP/genecontext-source"
          make -j2 test
